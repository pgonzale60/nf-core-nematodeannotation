repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.1.0"
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.9.6
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: |
          (?x)^(
              .*ro-crate-metadata.json$|
              modules/(?!local/).*|
              subworkflows/(?!local/).*|
              .*\.snap$
          )$
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
              .*ro-crate-metadata.json$|
              modules/(?!local/).*|
              subworkflows/(?!local/).*|
              .*\.snap$
          )$
      - id: check-added-large-files
        args: [--maxkb=5000]
        exclude: |
          (?x)^(
              .*ro-crate-metadata.json$|
              .*\.snap$|
              lib/nfcore_external_java_deps.jar$|
              docs/.*\.(svg|pdf)$|
              assets/.*$
          )$
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/seqeralabs/nf-lint-pre-commit
    rev: v0.3.0
    hooks:
      - id: nextflow-lint
        files: '\.nf$|nextflow\.config$'
        args: ["-output", "json"]
  - repo: local
    hooks:
      - id: stamp-module-shas
        name: Stamp module Script-SHA in main.nf for cache invalidation
        entry: python3 scripts/stamp_module_shas.py --pre-commit
        language: system
        files: 'modules/.*/resources/usr/(bin|lib)/.*\.py$'
        pass_filenames: false
      - id: block-pipeline-outdir
        name: Prevent committing output from pipeline test runs to the pipeline code itself
        entry: ./.hooks/block_pipeline_outdir.sh
        language: script
